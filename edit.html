<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CapCut E-Com Studio Mobile v4.0</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #07090e; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        /* Fullscreen handling for Mobile & Desktop */
        .fullscreen-active {
            position: fixed !important;
            top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important;
            z-index: 9999 !important;
            background-color: #000000 !important;
            display: flex !important;
            align-items: center !important; justify-content: center !important;
        }
        .fullscreen-active canvas {
            max-height: 100vh !important;
            max-width: calc(100vh * (9/16)) !important;
            width: auto !important; height: 100% !important;
        }

        .canvas-glow { box-shadow: 0 0 35px -5px rgba(56, 189, 248, 0.3); }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">

    <!-- Top Header Navigation Bar (Mobile Optimized) -->
    <header class="h-12 border-b border-slate-800 bg-slate-900/90 px-3 flex items-center justify-between shrink-0 z-30">
        <div class="flex items-center space-x-2">
            <span class="text-base">🎬</span>
            <div>
                <h1 class="text-xs font-bold text-white tracking-wide flex items-center gap-1.5">
                    CapCut E-Com Studio <span class="text-[9px] bg-cyan-500/20 text-cyan-400 px-1 py-0.2 rounded font-mono">v4.0 15-Styles</span>
                </h1>
            </div>
        </div>
        <div class="flex items-center space-x-1.5">
            <button onclick="toggleFullscreen()" class="px-2.5 py-1 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-200 text-[11px] font-medium border border-slate-700 flex items-center gap-1">
                <span>fullscreen</span>
            </button>
            <button id="exportBtn" onclick="startExport()" class="px-3 py-1 rounded-md bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white text-[11px] font-bold shadow-md shadow-cyan-500/20 flex items-center gap-1">
                <span>⬇️ Export 15s</span>
            </button>
        </div>
    </header>

    <!-- Main Mobile Layout Grid -->
    <div class="flex-1 flex flex-col overflow-hidden">
        
        <!-- TOP HALF: Canvas Video Player (Focused Screen) -->
        <main class="h-[46vh] bg-slate-950 flex flex-col items-center justify-center p-2 relative overflow-hidden shrink-0 border-b border-slate-800">
            <button id="exitFullscreenBtn" onclick="exitFullscreen()" class="hidden fixed top-4 right-4 z-50 bg-slate-900/90 hover:bg-slate-800 text-white px-3 py-1.5 rounded-full border border-slate-700 text-xs font-semibold">
                ✖ Keluar (ESC)
            </button>

            <!-- Video Player Box Container -->
            <div id="playerContainer" class="relative flex flex-col items-center justify-center h-full w-full">
                <!-- Canvas Element (9:16 Aspect Ratio) -->
                <canvas id="videoCanvas" width="1080" height="1920" class="h-full aspect-[9/16] bg-black rounded-xl canvas-glow border border-slate-800 object-contain"></canvas>

                <!-- Floating Video Player Controls Bar -->
                <div class="absolute bottom-2 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur border border-slate-700/80 rounded-full px-3 py-1 flex items-center space-x-2 shadow-xl z-30 w-[88%] max-w-[300px]">
                    <button id="playBtn" onclick="togglePlay()" class="w-6 h-6 rounded-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 flex items-center justify-center font-bold transition text-[10px] shrink-0">
                        ▶
                    </button>
                    <input type="range" id="timeScrubber" min="0" max="15" step="0.05" value="0" oninput="seekVideo(this.value)" class="flex-1 accent-cyan-400 h-1.5 bg-slate-700 rounded-lg cursor-pointer">
                    <span id="timeDisplay" class="font-mono text-[10px] text-slate-300 w-9 text-right shrink-0">00:00</span>
                </div>
            </div>
        </main>

        <!-- BOTTOM HALF: CapCut Mobile Editing Panel -->
        <section class="flex-1 bg-slate-900/70 flex flex-col overflow-hidden">
            <!-- Mobile Bottom Tabs Header -->
            <div class="flex border-b border-slate-800 bg-slate-900 shrink-0">
                <button onclick="switchTab('text')" id="tab-text" class="flex-1 py-2 text-xs font-bold text-cyan-400 border-b-2 border-cyan-400 transition">📸 Foto & Teks</button>
                <button onclick="switchTab('templates')" id="tab-templates" class="flex-1 py-2 text-xs font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition">🎨 15 Gaya Video</button>
                <button onclick="switchTab('timeline')" id="tab-timeline" class="flex-1 py-2 text-xs font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition">⏱️ Timeline</button>
            </div>

            <!-- Tab 1: 1 Foto & Form Konten Teks -->
            <div id="panel-text" class="p-3 space-y-2.5 overflow-y-auto flex-1 text-xs">
                <div class="bg-gradient-to-r from-cyan-950/50 to-slate-900 border border-cyan-800/50 p-2 rounded-lg shadow">
                    <label class="text-[11px] font-bold text-cyan-300 block mb-1">📸 Upload 1 Foto Produk (Auto 15s)</label>
                    <input type="file" id="imageUploader" accept="image/*" onchange="handleImageUpload(event)" class="w-full text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-[11px] file:bg-cyan-500 file:text-slate-950 file:font-bold hover:file:bg-cyan-400 cursor-pointer bg-slate-950 p-1 rounded border border-slate-800">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase block mb-0.5">Judul Main</label>
                        <input type="text" id="inputTitle" value="DOMPET KULIT PREMIUM" oninput="updateConfig()" class="w-full bg-slate-950 border border-slate-800 rounded px-2 py-1 text-slate-200 focus:outline-none focus:border-cyan-500">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase block mb-0.5">Nama Produk</label>
                        <input type="text" id="inputSubtitle" value="Elegance Leather Edition" oninput="updateConfig()" class="w-full bg-slate-950 border border-slate-800 rounded px-2 py-1 text-slate-200 focus:outline-none focus:border-cyan-500">
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase block mb-0.5">Keunggulan (Pisah Koma)</label>
                    <textarea id="inputFeatures" oninput="updateConfig()" class="w-full bg-slate-950 border border-slate-800 rounded px-2 py-1 text-slate-200 focus:outline-none focus:border-cyan-500 h-12">100% Kulit Sintetis, Slot Anti-RFID, Desain Slim Minimalis</textarea>
                </div>

                <div class="grid grid-cols-3 gap-1.5">
                    <div>
                        <label class="text-[9px] font-bold text-slate-400 uppercase block mb-0.5">Harga Promo</label>
                        <input type="text" id="inputPrice" value="Rp 99.000" oninput="updateConfig()" class="w-full bg-slate-950 border border-slate-800 rounded px-1.5 py-1 text-slate-200 focus:outline-none focus:border-cyan-500">
                    </div>
                    <div>
                        <label class="text-[9px] font-bold text-slate-400 uppercase block mb-0.5">Harga Coret</label>
                        <input type="text" id="inputOldPrice" value="Rp 250.000" oninput="updateConfig()" class="w-full bg-slate-950 border border-slate-800 rounded px-1.5 py-1 text-slate-200 focus:outline-none focus:border-cyan-500">
                    </div>
                    <div>
                        <label class="text-[9px] font-bold text-slate-400 uppercase block mb-0.5">Teks CTA</label>
                        <input type="text" id="inputCta" value="BELI SEKARANG" oninput="updateConfig()" class="w-full bg-slate-950 border border-slate-800 rounded px-1.5 py-1 text-slate-200 focus:outline-none focus:border-cyan-500">
                    </div>
                </div>
            </div>

            <!-- Tab 2: 15 Modern Templates (2 Columns Mobile Grid) -->
            <div id="panel-templates" class="p-2 space-y-1 overflow-y-auto flex-1 hidden">
                <div class="grid grid-cols-2 gap-1.5" id="templateGrid"></div>
            </div>

            <!-- Tab 3: Timeline & Scene Info -->
            <div id="panel-timeline" class="p-3 space-y-2 overflow-y-auto flex-1 hidden text-xs">
                <div class="flex items-center justify-between text-slate-400">
                    <span class="font-bold text-slate-200">⏱️ Visual Scene (15 Detik)</span>
                </div>
                <div class="relative w-full h-8 bg-slate-950 rounded border border-slate-800 overflow-hidden flex cursor-pointer" onclick="handleTimelineClick(event)">
                    <div class="w-1/3 h-full border-r border-slate-800 bg-cyan-950/40 px-1 py-0.5 text-[9px] font-semibold text-cyan-400 flex items-center truncate">Scene 1: Intro</div>
                    <div class="w-1/3 h-full border-r border-slate-800 bg-blue-950/40 px-1 py-0.5 text-[9px] font-semibold text-blue-400 flex items-center truncate">Scene 2: Fitur</div>
                    <div class="w-1/3 h-full bg-purple-950/40 px-1 py-0.5 text-[9px] font-semibold text-purple-400 flex items-center truncate">Scene 3: CTA</div>
                    <div id="playhead" class="absolute top-0 bottom-0 w-0.5 bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)] z-10 pointer-events-none" style="left: 0%;"></div>
                </div>
                <div class="bg-slate-950 border border-slate-800 p-2 rounded text-[10px] space-y-1 text-slate-400">
                    <p>• <strong>0-5s</strong>: Ken Burns / Glitch / Bounce Zoom Intro.</p>
                    <p>• <strong>5-10s</strong>: Parallax Slide & Checkmark Fitur Produk.</p>
                    <p>• <strong>10-15s</strong>: Animasi Harga Promo & Tombol CTA Berdenyut.</p>
                </div>
            </div>
        </section>
    </div>

    <!-- Main JavaScript Studio Engine -->
    <script>
        const DURATION = 15;
        let canvas, ctx;
        let isPlaying = false;
        let currentTime = 0;
        let lastTimestamp = 0;
        let isExporting = false;
        let activeTemplate = 'luxe';

        const walletImages = [
            'https://images.unsplash.com/photo-1627123424574-724758594e93?auto=format&fit=crop&w=1000&q=80',
            'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=1000&q=80',
            'https://images.unsplash.com/photo-1606503153255-59d8b8b82176?auto=format&fit=crop&w=1000&q=80'
        ];
        let loadedImages = [];

        // 15 TEMPLATE DENGAN ANIMASI GAYA VIDEO BERBEDA-BEDA (styleType)
        const templates = {
            luxe: { name: "Luxe Emerald", styleType: "luxe", bg: ["#064e3b", "#022c22"], accent: "#34d399", text: "#ffffff", badge: "PREMIUM" },
            cyber: { name: "Cyber Neon", styleType: "cyber", bg: ["#0f172a", "#020617"], accent: "#38bdf8", text: "#f8fafc", badge: "HOT ITEM" },
            flash: { name: "Flash Sale Red", styleType: "flash", bg: ["#7f1d1d", "#450a0a"], accent: "#fde047", text: "#ffffff", badge: "FLASH SALE 50%" },
            korean: { name: "Korean Soft", styleType: "korean", bg: ["#fbcfe8", "#f472b6"], accent: "#831843", text: "#831843", badge: "TRENDING" },
            clean: { name: "Clean Minimal", styleType: "clean", bg: ["#f8fafc", "#e2e8f0"], accent: "#0f172a", text: "#0f172a", badge: "BEST SELLER" },
            street: { name: "Urban Street", styleType: "street", bg: ["#18181b", "#09090b"], accent: "#facc15", text: "#ffffff", badge: "EXCLUSIVE" },
            gold: { name: "Royal Gold", styleType: "gold", bg: ["#451a03", "#1a0400"], accent: "#fbbf24", text: "#fffbeb", badge: "LUXURY" },
            sunset: { name: "Y2K Sunset", styleType: "sunset", bg: ["#c026d3", "#4c1d95"], accent: "#f43f5e", text: "#ffffff", badge: "NEW ARRIVAL" },
            tiktok: { name: "TikTok Viral", styleType: "tiktok", bg: ["#000000", "#111827"], accent: "#25f4ee", text: "#ffffff", badge: "VIRAL TIKTOK" },
            autumn: { name: "Warm Autumn", styleType: "autumn", bg: ["#78350f", "#27272a"], accent: "#fb923c", text: "#ffedd5", badge: "RECOMMENDED" },
            purple: { name: "Midnight Purple", styleType: "purple", bg: ["#3b0764", "#0f172a"], accent: "#c084fc", text: "#ffffff", badge: "DISCOUNT" },
            neon_pink: { name: "Electric Pink", styleType: "neon_pink", bg: ["#831843", "#500724"], accent: "#f472b6", text: "#ffffff", badge: "LIMITED" },
            dark_carbon: { name: "Carbon Fiber", styleType: "dark_carbon", bg: ["#171717", "#0a0a0a"], accent: "#22c55e", text: "#ffffff", badge: "ORIGINAL" },
            ocean: { name: "Deep Ocean", styleType: "ocean", bg: ["#0c4a6e", "#082f49"], accent: "#38bdf8", text: "#f0f9ff", badge: "SPECIAL" },
            editorial: { name: "Magz Editorial", styleType: "editorial", bg: ["#fafaf9", "#d6d3d1"], accent: "#1c1917", text: "#1c1917", badge: "OFFICIAL" }
        };

        window.onload = function() {
            canvas = document.getElementById('videoCanvas');
            ctx = canvas.getContext('2d');
            preloadImages(() => {
                renderTemplateSelector();
                drawScene();
                setupFullscreenListeners();
            });
        };

        function preloadImages(callback) {
            let loadedCount = 0;
            walletImages.forEach((src, idx) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.src = src;
                img.onload = () => {
                    loadedImages[idx] = img;
                    loadedCount++;
                    if (loadedCount === walletImages.length) callback();
                };
                img.onerror = () => {
                    loadedCount++;
                    if (loadedCount === walletImages.length) callback();
                };
            });
        }

        // KUNCI: 1 FOTO DIPAKAI UNTUK SEMUA SCENE
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    loadedImages = [img, img, img];
                    drawScene();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function renderTemplateSelector() {
            const grid = document.getElementById('templateGrid');
            grid.innerHTML = '';
            Object.keys(templates).forEach(key => {
                const t = templates[key];
                const activeClass = activeTemplate === key ? 'border-cyan-400 bg-slate-800' : 'border-slate-800 bg-slate-950 hover:border-slate-700';
                grid.innerHTML += `
                    <div onclick="selectTemplate('${key}')" class="p-2 rounded-lg border ${activeClass} cursor-pointer flex flex-col justify-between transition">
                        <div class="flex items-center space-x-1.5 mb-1">
                            <div class="w-4 h-4 rounded-full border border-slate-700 shrink-0" style="background: linear-gradient(135deg, ${t.bg[0]}, ${t.bg[1]})"></div>
                            <span class="text-[11px] font-bold text-slate-200 truncate">${t.name}</span>
                        </div>
                        <span class="text-[8px] px-1 py-0.2 rounded font-bold w-max" style="background:${t.accent}20; color:${t.accent}">${t.badge}</span>
                    </div>
                `;
            });
        }

        function selectTemplate(key) {
            activeTemplate = key;
            renderTemplateSelector();
            drawScene();
        }

        function switchTab(tab) {
            document.getElementById('panel-text').classList.toggle('hidden', tab !== 'text');
            document.getElementById('panel-templates').classList.toggle('hidden', tab !== 'templates');
            document.getElementById('panel-timeline').classList.toggle('hidden', tab !== 'timeline');

            document.getElementById('tab-text').className = tab === 'text' ? 'flex-1 py-2 text-xs font-bold text-cyan-400 border-b-2 border-cyan-400 transition' : 'flex-1 py-2 text-xs font-bold text-slate-400 border-b-2 border-transparent transition';
            document.getElementById('tab-templates').className = tab === 'templates' ? 'flex-1 py-2 text-xs font-bold text-cyan-400 border-b-2 border-cyan-400 transition' : 'flex-1 py-2 text-xs font-bold text-slate-400 border-b-2 border-transparent transition';
            document.getElementById('tab-timeline').className = tab === 'timeline' ? 'flex-1 py-2 text-xs font-bold text-cyan-400 border-b-2 border-cyan-400 transition' : 'flex-1 py-2 text-xs font-bold text-slate-400 border-b-2 border-transparent transition';
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById('playBtn').innerText = isPlaying ? '⏸' : '▶';
            if (isPlaying) {
                lastTimestamp = performance.now();
                requestAnimationFrame(animationLoop);
            }
        }

        function seekVideo(time) {
            currentTime = parseFloat(time);
            updateUI();
            drawScene();
        }

        function handleTimelineClick(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            const clickPos = (e.clientX - rect.left) / rect.width;
            seekVideo(clickPos * DURATION);
        }

        function animationLoop(timestamp) {
            if (!isPlaying) return;
            const delta = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;
            currentTime += delta;
            if (currentTime >= DURATION) currentTime = 0;
            updateUI();
            drawScene();
            if (isPlaying) requestAnimationFrame(animationLoop);
        }

        function updateUI() {
            document.getElementById('timeScrubber').value = currentTime;
            const pct = (currentTime / DURATION) * 100;
            document.getElementById('playhead').style.left = `${pct}%`;
            const mins = Math.floor(currentTime / 60).toString().padStart(2, '0');
            const secs = Math.floor(currentTime % 60).toString().padStart(2, '0');
            document.getElementById('timeDisplay').innerText = `${mins}:${secs}`;
        }

        function updateConfig() {
            drawScene();
        }

        // CANVAS ENGINE DENGAN LOGIKA EFEK BERBEDA UNTUK TIAP TEMPLATE
        function drawScene() {
            if (!ctx) return;
            const t = templates[activeTemplate];

            // 1. Background Render
            const grad = ctx.createLinearGradient(0, 0, 0, 1920);
            grad.addColorStop(0, t.bg[0]);
            grad.addColorStop(1, t.bg[1]);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1080, 1920);

            // 2. Scene Selector
            if (currentTime < 5) {
                drawScene1(currentTime, t);
            } else if (currentTime < 10) {
                drawScene2(currentTime - 5, t);
            } else {
                drawScene3(currentTime - 10, t);
            }

            // Top Watermark & Badge
            ctx.fillStyle = t.accent;
            ctx.font = 'bold 32px sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(`PROMO 15s • ${t.badge}`, 1020, 100);
        }

        // SCENE 1 (0-5s): EFEK ANIMASI BERBEDA BERDASARKAN styleType TEMPLATE
        function drawScene1(time, t) {
            const progress = time / 5;
            const img = loadedImages[0];
            const title = document.getElementById('inputTitle').value;
            const subtitle = document.getElementById('inputSubtitle').value;

            ctx.save();
            if (t.styleType === 'cyber') {
                // Cyberpunk Glitch Jump & Step Zoom
                const glitchX = (Math.random() - 0.5) * 12;
                const scale = 1 + Math.floor(progress * 5) * 0.04;
                ctx.translate(540 + glitchX, 800);
                ctx.scale(scale, scale);
            } 
            else if (t.styleType === 'korean') {
                // Wave Soft Floating Motion
                const floatY = Math.sin(time * 2.5) * 18;
                ctx.translate(540, 800 + floatY);
                ctx.scale(1.04, 1.04);
            } 
            else if (t.styleType === 'flash') {
                // Flash Sale High Energy Shake & Pulse
                const shakeX = (Math.random() - 0.5) * 6;
                const pulse = 1 + Math.sin(time * 12) * 0.05;
                ctx.translate(540 + shakeX, 800);
                ctx.scale(pulse, pulse);
            } 
            else if (t.styleType === 'tiktok') {
                // TikTok UGC Pop Zoom Step
                const stepScale = 1 + Math.sin(time * 6) * 0.03;
                ctx.translate(540, 780);
                ctx.scale(stepScale, stepScale);
            }
            else {
                // Default Smooth Ken Burns Zoom
                const scale = 1 + progress * 0.18;
                ctx.translate(540, 800);
                ctx.scale(scale, scale);
            }

            if (img) {
                ctx.drawImage(img, -400, -400, 800, 800);
            }
            ctx.restore();

            // Animated Text Card
            const textY = 1450 - progress * 25;
            const alpha = Math.min(time * 2, 1);
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.fillRect(100, textY - 120, 880, 240);
            ctx.fillStyle = t.accent;
            ctx.font = 'bold 64px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(title, 540, textY);
            ctx.fillStyle = t.text;
            ctx.font = '36px sans-serif';
            ctx.fillText(subtitle, 540, textY + 60);
            ctx.restore();
        }

        // SCENE 2 (5-10s): EFEK FITUR DENGAN VARIASI SLIDE / ROTATE / 3D TILT
        function drawScene2(time, t) {
            const img = loadedImages[1] || loadedImages[0];
            const features = document.getElementById('inputFeatures').value.split(',');

            if (img) {
                ctx.save();
                if (t.styleType === 'dark_carbon') {
                    // 3D Isometric Tilt Angle
                    ctx.translate(540, 650);
                    ctx.rotate(-0.08);
                    ctx.drawImage(img, -360, -360, 720, 720);
                } else if (t.styleType === 'street') {
                    // Geometric Diagonal Fast Slide
                    const slideX = (1 - Math.min(time * 3, 1)) * 1080;
                    ctx.drawImage(img, 140 + slideX, 350, 800, 800);
                } else {
                    // Parallax Floating Rotate
                    const floatY = Math.sin(time * 3) * 20;
                    const rotateAngle = Math.sin(time * 2) * 0.04;
                    ctx.translate(540, 650 + floatY);
                    ctx.rotate(rotateAngle);
                    ctx.drawImage(img, -350, -350, 700, 700);
                }
                ctx.restore();
            }

            // Feature List Checkmark Cards
            ctx.textAlign = 'left';
            features.forEach((feat, idx) => {
                const delayTime = idx * 0.8;
                if (time > delayTime) {
                    const itemAlpha = Math.min((time - delayTime) * 2, 1);
                    ctx.save();
                    ctx.globalAlpha = itemAlpha;
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
                    ctx.fillRect(100, 1250 + (idx * 110), 880, 85);
                    ctx.fillStyle = t.accent;
                    ctx.font = 'bold 40px sans-serif';
                    ctx.fillText(`✓ ${feat.trim()}`, 140, 1310 + (idx * 110));
                    ctx.restore();
                }
            });
        }

        // SCENE 3 (10-15s): PROMO PRICE & CTA PULSE ANIMATION
        function drawScene3(time, t) {
            const img = loadedImages[2] || loadedImages[0];
            const price = document.getElementById('inputPrice').value;
            const oldPrice = document.getElementById('inputOldPrice').value;
            const cta = document.getElementById('inputCta').value;

            if (img) {
                const scale = 1 + Math.sin(time * 4) * 0.03;
                ctx.save();
                ctx.translate(540, 550);
                ctx.scale(scale, scale);
                ctx.drawImage(img, -300, -300, 600, 600);
                ctx.restore();
            }

            // Strikethrough Old Price
            ctx.textAlign = 'center';
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.font = '40px sans-serif';
            ctx.fillText(oldPrice, 540, 950);
            ctx.strokeStyle = 'red';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(380, 935);
            ctx.lineTo(700, 935);
            ctx.stroke();

            // Big Promo Price
            ctx.fillStyle = t.accent;
            ctx.font = 'bold 100px sans-serif';
            ctx.fillText(price, 540, 1080);

            // Pulsing Call To Action Button
            const pulse = 1 + Math.sin(time * 8) * 0.05;
            ctx.save();
            ctx.translate(540, 1400);
            ctx.scale(pulse, pulse);
            ctx.fillStyle = t.accent;
            ctx.shadowColor = t.accent;
            ctx.shadowBlur = 30;
            ctx.fillRect(-350, -70, 700, 140);
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 50px sans-serif';
            ctx.shadowBlur = 0;
            ctx.fillText(cta, 0, 20);
            ctx.restore();
        }

        // Export System (Duration Lock 15s)
        function startExport() {
            if (isExporting) return;
            isExporting = true;
            isPlaying = false;
            currentTime = 0;

            const exportBtn = document.getElementById('exportBtn');
            exportBtn.disabled = true;
            exportBtn.classList.add('animate-pulse');

            const stream = canvas.captureStream(60);
            let mimeType = 'video/webm;codecs=vp9';
            if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm;codecs=vp8';
            if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';

            const mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType, videoBitsPerSecond: 8000000 });
            const chunks = [];
            mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };

            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `video-iklan-dompet-15s.webm`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                isExporting = false;
                exportBtn.disabled = false;
                exportBtn.classList.remove('animate-pulse');
                exportBtn.innerHTML = `<span>⬇️ Export 15s</span>`;
                isPlaying = true;
                requestAnimationFrame(animationLoop);
            };

            mediaRecorder.start(100);

            let startTime = null;
            function renderStep(timestamp) {
                if (!startTime) startTime = timestamp;
                const progress = (timestamp - startTime) / 1000;
                currentTime = Math.min(progress, DURATION);

                updateUI();
                drawScene();

                if (currentTime < DURATION && isExporting) {
                    const pct = Math.floor((currentTime / DURATION) * 100);
                    exportBtn.innerText = `⏺️ ${pct}%`;
                    requestAnimationFrame(renderStep);
                } else {
                    currentTime = DURATION;
                    drawScene();
                    mediaRecorder.stop();
                }
            }
            requestAnimationFrame(renderStep);
        }

        function toggleFullscreen() {
            const container = document.getElementById('playerContainer');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) container.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function exitFullscreen() {
            if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
        }

        function setupFullscreenListeners() {
            const container = document.getElementById('playerContainer');
            const exitBtn = document.getElementById('exitFullscreenBtn');
            document.addEventListener('fullscreenchange', () => {
                if (document.fullscreenElement) {
                    container.classList.add('fullscreen-active');
                    exitBtn.classList.remove('hidden');
                } else {
                    container.classList.remove('fullscreen-active');
                    exitBtn.classList.add('hidden');
                }
            });
        }
    </script>
</body>
